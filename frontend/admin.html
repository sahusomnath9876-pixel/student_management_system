<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Student Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #ffffff;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: none;
            vertical-align: middle;
            margin-left: 8px;
        }
        .btn-loading .spinner {
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- Navigation Bar -->
    <nav class="bg-gray-900 shadow-md sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0 flex items-center gap-2 text-white">
                        <div class="bg-red-500 text-white w-8 h-8 rounded flex items-center justify-center shadow-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M10 1.944A11.954 11.954 0 012.166 5C2.056 5.642 2 6.31 2 7c0 5.225 3.34 9.67 8 11.317C14.66 16.67 18 12.225 18 7c0-.69-.056-1.358-.166-2C15.904 3.2 13.04 2 10 1.944zM11 14a1 1 0 11-2 0 1 1 0 012 0zm0-7a1 1 0 10-2 0v3a1 1 0 102 0V7z" clip-rule="evenodd" />
                            </svg>
                        </div>
                        <span class="font-bold text-xl tracking-wide">Admin Portal</span>
                    </div>
                </div>
                <div class="flex items-center">
                    <span class="text-gray-300 text-sm mr-4 hidden sm:block">Logged in as Administrator</span>
                    <button id="logoutBtn" class="px-4 py-2 text-sm font-medium text-white bg-gray-800 hover:bg-red-600 rounded transition-colors flex items-center gap-2">
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-grow">
        
        <!-- Global Alert -->
        <div id="globalAlert" class="hidden mb-6 p-4 rounded text-sm font-medium shadow-sm"></div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <!-- Left Column: Add Course -->
            <div class="space-y-6">
                <div class="bg-white rounded shadow-sm border border-gray-200 overflow-hidden">
                    <div class="p-4 border-b border-gray-200 bg-gray-50">
                        <h2 class="text-lg font-bold text-gray-800">Add New Course</h2>
                    </div>
                    
                    <div class="p-6">
                        <form id="addCourseForm" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Course Name</label>
                                <input type="text" name="course_name" required class="block w-full px-3 py-2 border border-gray-300 rounded focus:ring-red-500 focus:border-red-500 text-sm">
                            </div>
                            
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Price (₹)</label>
                                    <input type="number" name="price" required class="block w-full px-3 py-2 border border-gray-300 rounded focus:ring-red-500 focus:border-red-500 text-sm">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Duration</label>
                                    <input type="text" name="duration" required placeholder="e.g. 6 Months" class="block w-full px-3 py-2 border border-gray-300 rounded focus:ring-red-500 focus:border-red-500 text-sm">
                                </div>
                            </div>

                            <div>
                                <!-- Note: using "total_seates" matching your backend typo exactly -->
                                <label class="block text-sm font-medium text-gray-700 mb-1">Total Seats</label>
                                <input type="number" name="total_seates" required class="block w-full px-3 py-2 border border-gray-300 rounded focus:ring-red-500 focus:border-red-500 text-sm">
                            </div>

                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Enrollment Start</label>
                                    <input type="date" name="en_start" required class="block w-full px-3 py-2 border border-gray-300 rounded focus:ring-red-500 focus:border-red-500 text-sm">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Enrollment End</label>
                                    <input type="date" name="en_end" required class="block w-full px-3 py-2 border border-gray-300 rounded focus:ring-red-500 focus:border-red-500 text-sm">
                                </div>
                            </div>

                            <button type="submit" id="addBtn" class="w-full mt-4 flex justify-center items-center py-2.5 px-4 border border-transparent rounded text-sm font-medium text-white bg-red-600 hover:bg-red-700 transition-colors">
                                <span id="addBtnText">Add Course</span>
                                <div class="spinner"></div>
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Right Column: Update & Delete -->
            <div class="space-y-8">
                
                <!-- Update Course -->
                <div class="bg-white rounded shadow-sm border border-gray-200 overflow-hidden">
                    <div class="p-4 border-b border-gray-200 bg-gray-50">
                        <h2 class="text-lg font-bold text-gray-800">Update Course</h2>
                    </div>
                    <div class="p-6">
                        <form id="updateCourseForm" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Course ID</label>
                                <input type="number" name="course_id" required class="block w-full px-3 py-2 border border-gray-300 rounded text-sm">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Field to Update (update_type)</label>
                                <input type="text" name="update_type" required placeholder="e.g. price, duration, course_name" class="block w-full px-3 py-2 border border-gray-300 rounded text-sm">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">New Value (update_data)</label>
                                <input type="text" name="update_data" required placeholder="New value" class="block w-full px-3 py-2 border border-gray-300 rounded text-sm">
                            </div>
                            <button type="submit" id="updateBtn" class="w-full flex justify-center items-center py-2.5 px-4 rounded text-sm font-medium text-white bg-yellow-500 hover:bg-yellow-600 transition-colors">
                                <span id="updateBtnText">Update Course</span>
                                <div class="spinner"></div>
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Delete Course -->
                <div class="bg-white rounded shadow-sm border border-red-200 overflow-hidden">
                    <div class="p-4 border-b border-red-200 bg-red-50">
                        <h2 class="text-lg font-bold text-red-800">Delete Course</h2>
                    </div>
                    <div class="p-6">
                        <form id="deleteCourseForm" class="flex gap-4 items-end">
                            <div class="flex-grow">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Course ID to Delete</label>
                                <input type="number" id="delete_course_id" name="course_id" required class="block w-full px-3 py-2 border border-red-300 rounded focus:ring-red-500 focus:border-red-500 text-sm">
                            </div>
                            <button type="submit" id="deleteBtn" class="flex-shrink-0 flex justify-center items-center py-2.5 px-6 rounded text-sm font-medium text-white bg-gray-900 hover:bg-black transition-colors">
                                <span id="deleteBtnText">Delete</span>
                                <div class="spinner"></div>
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </div>

        <!-- All Courses List Section -->
        <div class="mt-8 bg-white rounded shadow-sm border border-gray-200 overflow-hidden">
            <div class="p-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
                <h2 class="text-lg font-bold text-gray-800">All Courses</h2>
                <button id="refreshCoursesBtn" class="text-sm font-medium text-blue-600 hover:text-blue-800 flex items-center gap-1 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Refresh
                </button>
            </div>
            <div class="p-6">
                <div id="allCoursesList" class="space-y-4 max-h-[500px] overflow-y-auto pr-2">
                    <div class="text-center py-10 text-gray-500 flex flex-col items-center">
                        <div class="spinner !block mb-4" style="border-width: 3px; border-color: rgba(0,0,0, 0.1); border-top-color: #4b5563;"></div>
                        Loading courses...
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Enrollments Modal -->
    <div id="enrollmentsModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl overflow-hidden transform transition-all">
            <div class="p-5 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-800" id="enrollmentsModalTitle">Course Enrollments</h3>
                <button id="closeEnrollmentsBtn" class="text-gray-400 hover:text-gray-600 transition-colors p-1">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="p-6 max-h-[70vh] overflow-y-auto bg-white" id="enrollmentsContent">
                <!-- Data injected here -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Auth Guard (Admin specific)
            const token = localStorage.getItem('access_token');
            const role = localStorage.getItem('user_role');
            
            if (!token) {
                console.warn("No token found. In production, this redirects to login.");
                // window.location.href = 'index.html'; 
            } else if (role && role.toLowerCase() !== 'admin') {
                alert("Unauthorized: Admins only.");
                // window.location.href = 'student_service.html';
            }

            const API_BASE_URL = 'http://localhost:8000';
            const ADMIN_PREFIX = '/admin'; 

            const globalAlert = document.getElementById('globalAlert');

            // Utilities
            const showAlert = (message, type = 'error') => {
                globalAlert.textContent = message;
                globalAlert.className = `mb-6 p-4 rounded text-sm font-medium shadow-sm ${
                    type === 'error' ? 'bg-red-100 text-red-800 border border-red-200' : 'bg-green-100 text-green-800 border border-green-200'
                }`;
                globalAlert.classList.remove('hidden');
                setTimeout(() => globalAlert.classList.add('hidden'), 5000);
            };

            const toggleLoading = (btn, textSpan, isLoading, originalText) => {
                if (isLoading) {
                    btn.classList.add('btn-loading');
                    textSpan.textContent = 'Processing...';
                    btn.disabled = true;
                } else {
                    btn.classList.remove('btn-loading');
                    textSpan.textContent = originalText;
                    btn.disabled = false;
                }
            };

            const getAuthHeaders = () => ({
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}` 
            });

            // Helper to strictly format dates to yyyy-mm-dd
            const enforceDateFormat = (dateStr) => {
                if (!dateStr) return dateStr;
                const d = new Date(dateStr);
                let month = '' + (d.getMonth() + 1);
                let day = '' + d.getDate();
                const year = d.getFullYear();
                
                if (month.length < 2) month = '0' + month;
                if (day.length < 2) day = '0' + day;
                
                return [year, month, day].join('-');
            };

            // DOM Elements for New Features
            const allCoursesList = document.getElementById('allCoursesList');
            const refreshCoursesBtn = document.getElementById('refreshCoursesBtn');
            const enrollmentsModal = document.getElementById('enrollmentsModal');
            const enrollmentsContent = document.getElementById('enrollmentsContent');
            const enrollmentsModalTitle = document.getElementById('enrollmentsModalTitle');
            const closeEnrollmentsBtn = document.getElementById('closeEnrollmentsBtn');
            
            const updateCourseIdInput = document.querySelector('#updateCourseForm input[name="course_id"]');
            const deleteCourseIdInput = document.getElementById('delete_course_id');

            // --- Course Loading Logic ---
            const loadCourses = async () => {
                allCoursesList.innerHTML = `<div class="text-center py-10 text-gray-500 flex flex-col items-center"><div class="spinner !block mb-4" style="border-width: 3px; border-color: rgba(0,0,0, 0.1); border-top-color: #4b5563;"></div>Loading courses...</div>`;
                try {
                    const response = await fetch(`${API_BASE_URL}${ADMIN_PREFIX}/courses`, {
                        method: 'GET',
                        headers: getAuthHeaders()
                    });

                    if (!response.ok) throw new Error('Failed to fetch courses');
                    const courses = await response.json();

                    if (!courses || courses.length === 0) {
                        allCoursesList.innerHTML = `<div class="text-center py-6 text-gray-500">No courses available.</div>`;
                    } else {
                        allCoursesList.innerHTML = courses.map(course => `
                            <div class="p-5 bg-white border border-gray-200 rounded-lg flex flex-col lg:flex-row justify-between gap-4 items-start lg:items-center hover:border-gray-300 hover:shadow-sm transition-all">
                                <div class="w-full lg:w-auto">
                                    <div class="flex items-center gap-3 mb-2">
                                        <h4 class="font-bold text-gray-900 text-lg">${course.course_name}</h4>
                                        <span class="px-2.5 py-0.5 rounded text-xs font-bold bg-blue-100 text-blue-800 border border-blue-200">ID: ${course.course_id}</span>
                                    </div>
                                    <p class="text-sm text-gray-700 mb-1"><span class="font-semibold text-gray-500">Price:</span> ₹${course.price} <span class="mx-2 text-gray-300">|</span> <span class="font-semibold text-gray-500">Duration:</span> ${course.course_duration}</p>
                                    <p class="text-xs text-gray-500"><span class="font-semibold">Enrollment:</span> ${course.en_start} to ${course.en_end}</p>
                                </div>
                                <div class="flex flex-wrap gap-2 w-full lg:w-auto mt-2 lg:mt-0">
                                    <button onclick="viewEnrollments(${course.course_id}, '${course.course_name.replace(/'/g, "\\'")}')" class="flex-grow lg:flex-grow-0 px-4 py-2 bg-blue-50 text-blue-700 border border-blue-200 rounded-md text-sm font-medium hover:bg-blue-100 transition-colors text-center">
                                        View Enrollments
                                    </button>
                                    <button onclick="prefillUpdate(${course.course_id})" class="flex-grow lg:flex-grow-0 px-4 py-2 bg-yellow-50 text-yellow-700 border border-yellow-200 rounded-md text-sm font-medium hover:bg-yellow-100 transition-colors text-center">
                                        Update
                                    </button>
                                    <button onclick="prefillDelete(${course.course_id})" class="flex-grow lg:flex-grow-0 px-4 py-2 bg-red-50 text-red-700 border border-red-200 rounded-md text-sm font-medium hover:bg-red-100 transition-colors text-center">
                                        Delete
                                    </button>
                                </div>
                            </div>
                        `).join('');
                    }
                } catch (error) {
                    allCoursesList.innerHTML = `<div class="text-center py-6 text-red-500 text-sm font-medium">Failed to load courses: ${error.message}</div>`;
                }
            };

            // Global functions for inline event handlers
            window.prefillUpdate = (courseId) => {
                updateCourseIdInput.value = courseId;
                updateCourseIdInput.focus();
                window.scrollTo({top: 0, behavior: 'smooth'});
            };

            window.prefillDelete = (courseId) => {
                deleteCourseIdInput.value = courseId;
                deleteCourseIdInput.focus();
                window.scrollTo({top: 0, behavior: 'smooth'});
            };

            window.viewEnrollments = async (courseId, courseName) => {
                enrollmentsModalTitle.textContent = `Enrollments: ${courseName} (ID: ${courseId})`;
                enrollmentsModal.classList.remove('hidden');
                enrollmentsContent.innerHTML = `<div class="flex justify-center py-8"><div class="spinner !block" style="border-width: 3px; border-color: rgba(0,0,0, 0.1); border-top-color: #4b5563;"></div></div>`;
                
                try {
                    const response = await fetch(`${API_BASE_URL}${ADMIN_PREFIX}/enrollments?course_id=${courseId}`, {
                        method: 'GET',
                        headers: getAuthHeaders()
                    });
                    
                    if (!response.ok) throw new Error("Failed to fetch enrollments.");
                    const enrollments = await response.json();
                    
                    if (!enrollments || enrollments.length === 0) {
                        enrollmentsContent.innerHTML = `<div class="text-center py-8 text-gray-500 bg-gray-50 rounded border border-dashed border-gray-300">No students enrolled in this course yet.</div>`;
                        return;
                    }
                    
                    enrollmentsContent.innerHTML = enrollments.map(enm => `
                        <div class="p-4 bg-gray-50 border border-gray-200 rounded-lg mb-3 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                            <div class="space-y-1">
                                <p class="text-sm text-gray-800"><span class="font-bold text-gray-500">Enrollment ID:</span> <span class="font-semibold">${enm.enm_id}</span></p>
                                <p class="text-sm text-gray-800"><span class="font-bold text-gray-500">Student ID:</span> <span class="font-semibold text-blue-600">${enm.student_id}</span></p>
                            </div>
                            <div class="w-full sm:w-auto text-left sm:text-right">
                                <p class="text-xs text-gray-500 font-bold mb-1">Transaction ID</p>
                                <p class="text-xs font-mono bg-white border border-gray-200 text-gray-600 px-3 py-1.5 rounded-md inline-block break-all w-full sm:max-w-[200px] shadow-sm">${enm.txn_id}</p>
                            </div>
                        </div>
                    `).join('');

                } catch (error) {
                    enrollmentsContent.innerHTML = `<div class="text-red-500 text-center py-6 text-sm bg-red-50 rounded border border-red-200">${error.message}</div>`;
                }
            };

            // Modal Close Listeners
            closeEnrollmentsBtn.addEventListener('click', () => enrollmentsModal.classList.add('hidden'));
            enrollmentsModal.addEventListener('click', (e) => {
                if (e.target === enrollmentsModal) enrollmentsModal.classList.add('hidden');
            });

            // Initialize List & Refresh
            loadCourses();
            refreshCoursesBtn.addEventListener('click', loadCourses);

            // 1. ADD COURSE
            document.getElementById('addCourseForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const form = e.target;
                const btn = document.getElementById('addBtn');
                const btnText = document.getElementById('addBtnText');
                
                toggleLoading(btn, btnText, true, 'Add Course');

                const payload = {
                    course_name: form.course_name.value,
                    price: parseInt(form.price.value, 10),
                    duration: form.duration.value,
                    total_seates: parseInt(form.total_seates.value, 10), // Matches exact spelling
                    en_start: enforceDateFormat(form.en_start.value),
                    en_end: enforceDateFormat(form.en_end.value)
                };

                try {
                    const response = await fetch(`${API_BASE_URL}${ADMIN_PREFIX}/add_course`, {
                        method: 'POST',
                        headers: getAuthHeaders(),
                        body: JSON.stringify(payload)
                    });

                    const data = await response.json();
                    if (!response.ok) throw new Error(data.detail || 'Failed to add course');
                    
                    showAlert(`Successfully added course: ${data.course_name} (ID: ${data.course_id})`, 'success');
                    form.reset();
                    loadCourses(); // Refresh list automatically
                } catch (error) {
                    showAlert(error.message, 'error');
                } finally {
                    toggleLoading(btn, btnText, false, 'Add Course');
                }
            });

            // 2. UPDATE COURSE
            document.getElementById('updateCourseForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const form = e.target;
                const btn = document.getElementById('updateBtn');
                const btnText = document.getElementById('updateBtnText');
                
                toggleLoading(btn, btnText, true, 'Update Course');

                // Try to parse to int if it's a number (for fields like price), else string
                let updateVal = form.update_data.value;
                if (!isNaN(updateVal) && updateVal.trim() !== '') {
                    updateVal = parseInt(updateVal, 10);
                }

                const payload = {
                    course_id: parseInt(form.course_id.value, 10),
                    update_type: form.update_type.value,
                    update_data: updateVal // 'Any' type in pydantic
                };

                try {
                    const response = await fetch(`${API_BASE_URL}${ADMIN_PREFIX}/update_course`, {
                        method: 'PATCH',
                        headers: getAuthHeaders(),
                        body: JSON.stringify(payload)
                    });

                    const data = await response.json();
                    if (!response.ok) throw new Error(data.detail || 'Failed to update course');
                    
                    showAlert(`Successfully updated ${data.updated_type} for Course ID ${data.course_id}`, 'success');
                    form.reset();
                    loadCourses(); // Refresh list automatically
                } catch (error) {
                    showAlert(error.message, 'error');
                } finally {
                    toggleLoading(btn, btnText, false, 'Update Course');
                }
            });

            // 3. DELETE COURSE
            document.getElementById('deleteCourseForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const form = e.target;
                const btn = document.getElementById('deleteBtn');
                const btnText = document.getElementById('deleteBtnText');
                
                toggleLoading(btn, btnText, true, 'Delete');
                const courseId = form.course_id.value;

                try {
                    // Passed as a query parameter usually for single IDs in FastAPI unless it's a model
                    const response = await fetch(`${API_BASE_URL}${ADMIN_PREFIX}/delete_course?course_id=${courseId}`, {
                        method: 'DELETE',
                        headers: getAuthHeaders()
                    });

                    const data = await response.json();
                    if (!response.ok) throw new Error(data.detail || 'Failed to delete course');
                    
                    showAlert(data.detail || 'Course deleted successfully', 'success');
                    form.reset();
                    loadCourses(); // Refresh list automatically
                } catch (error) {
                    showAlert(error.message, 'error');
                } finally {
                    toggleLoading(btn, btnText, false, 'Delete');
                }
            });

            // Logout
            document.getElementById('logoutBtn').addEventListener('click', () => {
                localStorage.removeItem('access_token');
                localStorage.removeItem('user_role');
                // window.location.href = 'index.html';
                document.body.innerHTML = '<div class="p-8 text-center text-xl">Logged out. <a href="index.html" class="text-blue-500">Return to login</a></div>';
            });
        });
    </script>
</body>
</html>
