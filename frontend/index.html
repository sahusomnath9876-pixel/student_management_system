<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom spinner for loading state */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #ffffff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
            vertical-align: middle;
            margin-left: 8px;
        }
        .btn-loading .spinner {
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-white flex min-h-screen">

    <!-- Left Side: Branding / Decorative -->
    <div class="hidden lg:flex lg:w-1/2 bg-gradient-to-br from-blue-600 to-indigo-800 justify-center items-center p-12 relative overflow-hidden">
        <!-- Background decoration -->
        <div class="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none">
            <svg class="absolute transform -translate-x-1/2 -translate-y-1/2 top-0 left-0 w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none">
                <circle cx="50" cy="50" r="40" fill="currentColor" />
            </svg>
        </div>
        
        <div class="z-10 text-white max-w-lg">
            <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center mb-8 backdrop-blur-sm border border-white/30">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path d="M12 14l9-5-9-5-9 5 9 5z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <h1 class="text-4xl font-bold mb-4 leading-tight">Empowering Student Success.</h1>
            <p class="text-lg text-blue-100 font-light">Access your courses, manage your enrollments, and take control of your academic journey all in one place.</p>
        </div>
    </div>

    <!-- Right Side: Login Form -->
    <div class="flex w-full lg:w-1/2 justify-center items-center p-8 sm:p-12 bg-gray-50 lg:bg-white">
        <div class="w-full max-w-md">
            
            <!-- Mobile Header (Visible only on small screens) -->
            <div class="lg:hidden text-center mb-8">
                <div class="bg-blue-600 text-white w-14 h-14 rounded-xl flex items-center justify-center mx-auto mb-4 shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">Welcome Back</h2>
                <p class="text-sm text-gray-500 mt-1">Please sign in to your account</p>
            </div>

            <!-- Desktop Header -->
            <div class="hidden lg:block mb-8">
                <h2 class="text-3xl font-bold text-gray-900 mb-2">Sign In</h2>
                <p class="text-gray-500">Welcome back! Please enter your details.</p>
            </div>

            <!-- Alert Message Container -->
            <div id="alertBox" class="hidden mb-6 p-4 rounded-lg text-sm font-medium"></div>

            <!-- Form -->
            <form id="loginForm" class="space-y-5">
                
                <!-- Username Input -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </div>
                        <input type="text" id="username" name="username" required
                            class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-600 focus:border-blue-600 text-sm transition-shadow bg-gray-50/50"
                            placeholder="Enter your username">
                    </div>
                </div>

                <!-- Password Input -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </div>
                        <input type="password" id="password" name="password" required
                            class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-600 focus:border-blue-600 text-sm transition-shadow bg-gray-50/50"
                            placeholder="••••••••">
                    </div>
                </div>

                <!-- Options -->
                <div class="flex items-center justify-between pt-2">
                    <div class="flex items-center">
                        <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded cursor-pointer">
                        <label for="remember-me" class="ml-2 block text-sm text-gray-700 cursor-pointer">
                            Remember me
                        </label>
                    </div>
                    <div class="text-sm">
                        <a href="#" class="font-medium text-blue-600 hover:text-blue-800 transition-colors">Forgot password?</a>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-600 transition-all transform active:scale-[0.98]">
                    <span id="btnText">Sign in to portal</span>
                    <div class="spinner"></div>
                </button>

                <!-- Signup Link -->
                <div class="mt-6 text-center text-sm text-gray-600">
                    Don't have an account? <a href="signup.html" class="font-medium text-blue-600 hover:text-blue-800 transition-colors">Sign up</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const alertBox = document.getElementById('alertBox');
            
            // Set your FastAPI backend URL here
            const API_BASE_URL = 'http://127.0.0.1:8000';

            const showAlert = (message, type = 'error') => {
                alertBox.textContent = message;
                alertBox.className = `mb-6 p-4 rounded-lg text-sm font-medium ${
                    type === 'error' ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-green-50 text-green-700 border border-green-200'
                }`;
                alertBox.classList.remove('hidden');
            };

            const hideAlert = () => {
                alertBox.classList.add('hidden');
            };

            const setLoading = (isLoading) => {
                if (isLoading) {
                    submitBtn.classList.add('btn-loading');
                    btnText.textContent = 'Authenticating...';
                    submitBtn.disabled = true;
                } else {
                    submitBtn.classList.remove('btn-loading');
                    btnText.textContent = 'Sign in to portal';
                    submitBtn.disabled = false;
                }
            };

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideAlert();
                setLoading(true);

                const username = form.username.value;
                const password = form.password.value;

                try {
                    const response = await fetch(`${API_BASE_URL}/auth/signin`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        const errorMsg = data.detail || 'Invalid username or password.';
                        throw new Error(errorMsg);
                    }

                    // Store token and role securely in client storage
                    localStorage.setItem('access_token', data.access_token);
                    if (data.role) {
                        localStorage.setItem('user_role', data.role);
                    }
                    
                    // Determine where to redirect based on role safely
                    let userRoleDisplay = data.role ? String(data.role).toLowerCase() : 'student';
                    let redirectTarget = 'student.html';
                    
                    if (userRoleDisplay.includes('admin')) {
                        redirectTarget = 'admin.html';
                    }

                    showAlert(`Successfully signed in as ${userRoleDisplay}! Redirecting...`, 'success');
                    
                    // Redirect to the appropriate portal
                    setTimeout(() => {
                        window.location.href = redirectTarget; 
                    }, 1000);

                } catch (error) {
                    if(error.message.includes('Failed to fetch')) {
                         showAlert('Cannot connect to the server. Is your FastAPI backend running?');
                    } else {
                         showAlert(error.message);
                    }
                } finally {
                    setLoading(false);
                }
            });
        });
    </script>
</body>
</html>
